<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Kiosk</title>
  <style>
  /* Prispôsobenie pre TV obrazovky */
  body {
    background-color: #0d0f12;
    color: #ffffff;
    font-family: 'Segoe UI', Roboto, sans-serif;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
    height: 100vh;
    overflow: hidden;
  }

  .container {
    display: grid;
    grid-template-columns: 2fr 1fr; /* Vľavo prehrávač, vpravo zoznam staníc */
    gap: 20px;
    height: calc(100vh - 40px);
  }

  .player-container {
    background: #000;
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border: 2px solid #222;
  }

  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .channels-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    align-content: start;
    overflow-y: auto;
  }

  /* Kľúčový štýl pre D-Pad (ovládač TV) */
  .channel-card {
    background: #1a1d24;
    border: 3px solid transparent;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
    cursor: pointer;
    outline: none;
    transition: all 0.2s ease-in-out;
  }

  /* Zvýraznenie pri výbere šípkou na ovládači */
  .channel-card:focus, .channel-card:hover {
    border-color: #0088ff;
    background: #252a36;
    transform: scale(1.03);
    box-shadow: 0 0 15px rgba(0, 136, 255, 0.4);
  }

  .channel-card h3 {
    margin: 10px 0 0 0;
    font-size: 1.1rem;
  }
  /* Pridané štýly pre ovládacie tlačidlá prehrávača */
  .player-controls {
    display: flex;
    gap: 10px;
    padding: 10px;
    background: #111;
    justify-content: center;
  }

  .btn-tv {
    background: #252a36;
    color: #fff;
    border: 2px solid transparent;
    border-radius: 8px;
    padding: 8px 16px;
    cursor: pointer;
    outline: none;
    font-size: 0.9rem;
  }

  /* Focus štýl pre tlačidlá v prehrávači */
  .btn-tv:focus, .btn-tv:hover {
    border-color: #0088ff;
    background: #0088ff;
  }
</style>

<div class="container">
  <!-- Hlavný prehrávač s vlastnými tlačidlami -->
  <div class="player-container">
    <video id="videoPlayer" autoplay></video>
    
    <div class="player-controls">
      <button class="btn-tv nav-item" tabindex="0" onclick="togglePlay()">Play / Pause</button>
      <button class="btn-tv nav-item" tabindex="0" onclick="toggleFullscreen()">Celá obrazovka</button>
    </div>
  </div>
  
  <!-- Zoznam TV staníc -->
  <div class="channels-grid">
    <div class="channel-card" tabindex="0" onclick="playStream('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">
      <h3>STVR 1</h3>
    </div>
    <div class="channel-card" tabindex="0" onclick="playStream('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">
      <h3>STVR 2</h3>
    </div>
    <div class="channel-card" tabindex="0" onclick="playStream('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">
      <h3>STVR Šport</h3>
    </div>
    <div class="channel-card" tabindex="0" onclick="playStream('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">
      <h3>TA3</h3>
    </div>
  </div>
</div>

<!-- Načítanie HLS.js pre prehrávanie m3u8 streamov -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
  const video = document.getElementById('videoPlayer');
  let hls = null;

  function playStream(url) {
    if (Hls.isSupported()) {
      if (hls) {
        hls.destroy();
      }
      hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function() {
        video.play();
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      // Pre prehliadače s natívnou podporou HLS (napr. Safari)
      video.src = url;
      video.play();
    }
  }

  // Správa navigácie pomocou šípok (D-pad)
  document.addEventListener('keydown', function(e) {
    const focusable = Array.from(document.querySelectorAll('.channel-card'));
    const index = focusable.indexOf(document.activeElement);

    if (index === -1) {
      // Ak nie je označené nič, prvá šípka označí prvú stanicu
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
        focusable[0].focus();
        e.preventDefault();
      }
      return;
    }

    let nextIndex = index;

    switch (e.key) {
      case 'ArrowLeft':
        if (index % 2 !== 0) nextIndex = index - 1; // Posun vľavo v 2-stĺpcovej mriežke
        break;
      case 'ArrowRight':
        if (index % 2 === 0 && index + 1 < focusable.length) nextIndex = index + 1; // Posun vpravo
        break;
      case 'ArrowUp':
        if (index - 2 >= 0) nextIndex = index - 2; // Posun o riadok nahor
        break;
      case 'ArrowDown':
        if (index + 2 < focusable.length) nextIndex = index + 2; // Posun o riadok nadol
        break;
      case 'Enter':
        document.activeElement.click(); // Potvrdenie výberu
        break;
    }

    if (nextIndex !== index) {
      e.preventDefault(); // Zaznamenanie šípky neposunie celú stránku
      focusable[nextIndex].focus();
    }
  });
  
  // Funkcie prehrávača
  function togglePlay() {
    if (video.paused) {
      video.play();
    } else {
      video.pause();
    }
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      video.requestFullscreen().catch(err => alert(err.message));
    } else {
      document.exitFullscreen();
    }
  }

  // Pokročilá navigácia pre TV
  document.addEventListener('keydown', function(e) {
    const focusable = Array.from(document.querySelectorAll('.nav-item'));
    const current = document.activeElement;
    const index = focusable.indexOf(current);

    if (index === -1) {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
        focusable[2].focus(); // Označí prvú stanicu v zozname
        e.preventDefault();
      }
      return;
    }

    // Určenie zóny (0 a 1 sú tlačidlá prehrávača, 2+ sú stanice)
    const inPlayer = index < 2;

    switch (e.key) {
      case 'ArrowLeft':
        if (!inPlayer) {
          // Prechod zo zoznamu staníc na ovládanie prehrávača
          focusable[0].focus();
        } else if (index === 1) {
          focusable[0].focus();
        }
        e.preventDefault();
        break;

      case 'ArrowRight':
        if (inPlayer) {
          if (index === 0) {
            focusable[1].focus();
          } else {
            // Prechod z prehrávača na zoznam staníc
            focusable[2].focus();
          }
        } else if (index % 2 === 0 && index + 1 < focusable.length) {
          focusable[index + 1].focus();
        }
        e.preventDefault();
        break;

      case 'ArrowUp':
        if (!inPlayer && index - 2 >= 2) {
          focusable[index - 2].focus();
        }
        e.preventDefault();
        break;

      case 'ArrowDown':
        if (inPlayer) {
          // Nie je potrebné
        } else if (index + 2 < focusable.length) {
          focusable[index + 2].focus();
        }
        e.preventDefault();
        break;

      case 'Enter':
        current.click();
        break;
    }
  });
</script>
  
</body>
</html>
