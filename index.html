<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Kiosk</title>
  <style>
  /* Prispôsobenie pre TV obrazovky */
  body {
    background-color: #0d0f12;
    color: #ffffff;
    font-family: 'Segoe UI', Roboto, sans-serif;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
    height: 100vh;
    overflow: hidden;
  }

  .container {
    display: grid;
    grid-template-columns: 2fr 1fr; /* Vľavo prehrávač, vpravo zoznam staníc */
    gap: 20px;
    height: calc(100vh - 40px);
  }

  .player-container {
    background: #000;
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border: 2px solid #222;
  }

  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .channels-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    align-content: start;
    overflow-y: auto;
  }

  /* Kľúčový štýl pre D-Pad (ovládač TV) */
  .channel-card {
    background: #1a1d24;
    border: 3px solid transparent;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
    cursor: pointer;
    outline: none;
    transition: all 0.2s ease-in-out;
  }

  /* Zvýraznenie pri výbere šípkou na ovládači */
  .channel-card:focus, .channel-card:hover {
    border-color: #0088ff;
    background: #252a36;
    transform: scale(1.03);
    box-shadow: 0 0 15px rgba(0, 136, 255, 0.4);
  }

  .channel-card h3 {
    margin: 10px 0 0 0;
    font-size: 1.1rem;
  }
</style>

<div class="container">
  <!-- Hlavný prehrávač -->
  <div class="player-container">
    <video id="videoPlayer" controls autoplay></video>
  </div>

  <!-- Zoznam TV staníc -->
  <div class="channels-grid">
    <div class="channel-card" tabindex="0" onclick="playStream('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">
      <h3>STVR 1</h3>
    </div>
    <div class="channel-card" tabindex="0" onclick="playStream('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">
      <h3>STVR 2</h3>
    </div>
    <div class="channel-card" tabindex="0" onclick="playStream('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">
      <h3>STVR Šport</h3>
    </div>
    <div class="channel-card" tabindex="0" onclick="playStream('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">
      <h3>TA3</h3>
    </div>
  </div>
</div>

<!-- Načítanie HLS.js pre prehrávanie m3u8 streamov -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
  const video = document.getElementById('videoPlayer');
  let hls = null;

  function playStream(url) {
    if (Hls.isSupported()) {
      if (hls) {
        hls.destroy();
      }
      hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function() {
        video.play();
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      // Pre prehliadače s natívnou podporou HLS (napr. Safari)
      video.src = url;
      video.play();
    }
  }
</script>
</body>
</html>
